<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy - גלישה מאובטחת</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        .url-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        #urlInput {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }

        #urlInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .iframe-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            height: calc(100vh - 250px);
            min-height: 400px;
        }

        #proxyFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #667eea;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }

            .url-bar {
                flex-direction: column;
            }

            #urlInput {
                width: 100%;
            }

            .btn {
                width: 100%;
                padding: 12px;
            }

            .controls {
                flex-direction: column;
            }

            .iframe-container {
                height: calc(100vh - 320px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Web Proxy - גלישה מאובטחת</h1>
            
            <div class="url-bar">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="הכנס כתובת אתר (לדוגמה: https://example.com)"
                    dir="ltr"
                >
                <button class="btn btn-primary" onclick="loadUrl()">גלוש</button>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="goBack()">◀ אחורה</button>
                <button class="btn btn-secondary" onclick="goForward()">קדימה ▶</button>
                <button class="btn btn-secondary" onclick="refreshPage()">🔄 רענן</button>
                <button class="btn btn-secondary" onclick="goHome()">🏠 בית</button>
            </div>
        </div>

        <div class="iframe-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>טוען...</div>
            </div>
            <iframe id="proxyFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>

        <div class="info">
            💡 טיפ: הכנס כתובת אתר מלאה (כולל https://) כדי לגלוש באתר דרך ה-proxy
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
